<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>MONEA · Prototipo v2</title>
<style>
/* ============ TOKENS ============ */
:root{
  --cerise-50:#fef1fb;--cerise-100:#fee5f8;--cerise-200:#ffcaf3;--cerise-300:#ff9fe6;--cerise-400:#ff64d4;
  --cerise-500:#fe36c1;--cerise-600:#ef13a1;--cerise-700:#e0068c;--cerise-800:#ac086b;--cerise-900:#8f0c5b;--cerise-950:#580034;

  --bg:#f2f2f7;--surface:#ffffff;--surface-2:#f7f7fa;--text:#1c1c1e;--muted:#8e8e93;--sep:rgba(60,60,67,.14);
  --accent:var(--cerise-600);--accent-ink:var(--cerise-700);--accent-soft:var(--cerise-50);--on-accent:#ffffff;
  --pos:#248a3d;--neg:#d70015;--fill:rgba(120,120,128,.12);
  --glass:rgba(255,255,255,.58);--glass-line:rgba(255,255,255,.75);
  --shadow:0 10px 30px rgba(88,0,52,.08);
  --hero-a:var(--cerise-500);--hero-b:var(--cerise-800);
  --scrim:rgba(20,0,12,.32);
}
[data-theme="dark"]{
  --bg:#000000;--surface:#1c1c1e;--surface-2:#2c2c2e;--text:#ffffff;--muted:#98989f;--sep:rgba(84,84,88,.65);
  --accent:var(--cerise-400);--accent-ink:var(--cerise-300);--accent-soft:rgba(255,100,212,.14);--on-accent:#1a0012;
  --pos:#30d158;--neg:#ff453a;--fill:rgba(120,120,128,.30);
  --glass:rgba(44,44,48,.58);--glass-line:rgba(255,255,255,.12);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --hero-a:var(--cerise-700);--hero-b:var(--cerise-950);
  --scrim:rgba(0,0,0,.55);
}

/* ============ BASE ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
.screen{padding:0 16px 150px;min-height:100vh;animation:in .28s ease}
.screen.auth{padding-bottom:40px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ============ TOP BARS ============ */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:52px;margin:0 -16px;padding:0 12px;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:.5px solid var(--sep)}
.bar-t{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:17px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{min-width:44px;display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.side.r{justify-content:flex-end}
.topspace{height:12px}
.topline{padding:8px 0 0}
.lhdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 0 14px}
.lhdr h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.5px;margin:0}
.kicker{color:var(--muted);font-size:14px;margin-bottom:2px}
.sub{color:var(--muted);font-size:15px;margin:4px 0 0}
.sub.c{text-align:center}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;color:var(--accent-ink);flex:none}
.ib svg{width:20px;height:20px}
.tbtn{background:none;border:0;color:var(--accent-ink);font-size:17px;font-weight:600;cursor:pointer;padding:6px}
.lnk{background:none;border:0;color:var(--accent-ink);font-size:15px;font-weight:500;cursor:pointer;padding:0}
.h-sec{display:flex;justify-content:space-between;align-items:center;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:24px 14px 8px}
.h-sec .lnk{text-transform:none;letter-spacing:0;font-size:14px}

/* ============ SURFACES ============ */
.group{background:var(--surface);border-radius:20px;overflow:hidden;margin-bottom:4px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;position:relative}
.row[onclick]{cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:14px;height:.5px;background:var(--sep)}
.row.i+.row.i::before{left:60px}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{display:block;color:var(--muted);font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv{font-variant-numeric:tabular-nums;font-size:16px;text-align:right;white-space:nowrap}
.chev{display:flex;color:var(--muted)}
.chev svg{width:14px;height:14px}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.ico svg{width:18px;height:18px}
.ico.neutral{background:var(--fill);color:var(--text)}
.ini{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.card{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:12px}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.muted{color:var(--muted)}
.center{text-align:center}
.mt{margin-top:16px}
.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:14px}

/* ============ HERO ============ */
.hero{border-radius:24px;padding:20px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12);right:-70px;top:-80px}
.hero .lab{opacity:.85;font-size:14px;position:relative}
.hero .big{font-size:38px;font-weight:700;letter-spacing:-.8px;font-variant-numeric:tabular-nums;margin-top:4px;position:relative}
.hero-row{display:flex;justify-content:space-between;font-size:14px;margin-top:12px;position:relative;opacity:.95}
.hero.sm{padding:16px;border-radius:22px}
.hero.sm .big{font-size:30px}

/* ============ CREDIT CARD VISUAL ============ */
.ccard{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:18px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 14px 30px -14px var(--c2);min-height:172px;display:flex;flex-direction:column;justify-content:space-between}
.ccard::before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-90px;top:-100px;background:rgba(255,255,255,.14)}
.ccard::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;left:-60px;bottom:-90px;background:rgba(255,255,255,.08)}
.ccard>*{position:relative;z-index:1}
.ccard .cn{font-size:15px;font-weight:600;opacity:.95}
.ccard .cnum{font-size:19px;letter-spacing:2px;font-variant-numeric:tabular-nums}
.ccard .cb{display:flex;justify-content:space-between;align-items:flex-end}
.ccard small{display:block;opacity:.85;font-size:12px}
.ccard b{font-size:20px;font-variant-numeric:tabular-nums}
.mini{background:var(--surface);border-radius:20px;padding:14px;width:200px;box-shadow:var(--shadow);flex:none;cursor:pointer}
.mini .mb{height:6px;border-radius:3px;margin-bottom:12px}
.mini b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{color:var(--muted);font-size:12px}
.mini .mv{font-size:20px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

/* ============ CONTROLS ============ */
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:6px 0 16px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:0;font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--accent);color:var(--on-accent)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);white-space:nowrap}
.tag.ok{background:rgba(48,209,88,.16);color:var(--pos)}
.tag.acc{background:var(--accent-soft);color:var(--accent-ink)}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:600;background:var(--accent);color:var(--on-accent);cursor:pointer;box-shadow:0 8px 20px -10px var(--accent);display:block;text-align:center}
.btn:active{transform:scale(.99)}
.btn.ghost{background:var(--fill);color:var(--accent-ink);box-shadow:none}
.btn.danger{background:transparent;color:var(--neg);box-shadow:none}
.btn.sm{width:auto;display:inline-block;padding:9px 14px;font-size:14px;border-radius:12px;box-shadow:none}
.progress{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.sw{position:relative;width:51px;height:31px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--fill);border-radius:31px;transition:background .2s}
.sw span::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+span{background:var(--pos)}
.sw input:checked+span::after{transform:translateX(20px)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none;transition:.15s}
.chk svg{width:14px;height:14px;color:#fff;opacity:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on svg{opacity:1}
.item.on .rt b{text-decoration:line-through;color:var(--muted)}
.stp{display:flex;align-items:center;gap:12px}
.stp button{width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);font-size:18px;cursor:pointer}
.stp .v{min-width:18px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.colors{display:flex;gap:12px;flex-wrap:wrap;padding:12px 14px}
.colors span{width:30px;height:30px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 2px var(--surface)}
.colors span.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}

/* ============ FORM FIELDS ============ */
.field{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:52px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;right:0;left:14px;height:.5px;background:var(--sep)}
.field label{font-size:16px;flex:none}
.field input,.field select{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;text-align:right;color:var(--text);padding:0}
.field input::placeholder{color:var(--muted)}
.field select{appearance:none;-webkit-appearance:none;color:var(--accent-ink);font-weight:500}
.field input.tot{font-weight:600;font-size:18px}
.field input.tot.locked{color:var(--muted)}
.auth-group .field input{text-align:left}
textarea{width:100%;border:0;background:none;outline:none;font-size:16px;padding:14px;resize:none;min-height:90px}
.amt-input{display:flex;justify-content:center;align-items:baseline;gap:4px;padding:18px 0 14px;font-size:44px;font-weight:700;letter-spacing:-1px}
.amt-input input{border:0;background:none;outline:none;font:inherit;width:70%;text-align:center;color:var(--text)}
.amt-input input::placeholder{color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--accent-soft);color:var(--accent-ink);margin-bottom:12px;cursor:pointer}
.banner b{display:block;font-size:15px;color:var(--text)}
.banner small{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);background:var(--fill);border-radius:14px;padding:12px 14px;margin-top:12px;line-height:1.4}

/* ============ LISTA DE COMPRAS: precios y edición ============ */
.pwrap{display:none;align-items:center}
#itemsGroup.prices-on .pwrap{display:flex}
.pinp{width:86px;border:0;background:var(--fill);border-radius:10px;padding:7px 8px;text-align:right;font:inherit;font-size:15px;outline:none;color:var(--text)}
.pinp::placeholder{color:var(--muted)}
.ib.del{width:30px;height:30px;color:var(--neg);background:none}
.ib.del svg{width:18px;height:18px}
.add-row{display:flex;align-items:center;gap:10px;padding:10px 14px;position:relative}
.add-row input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--text)}
.add-row input::placeholder{color:var(--muted)}
.add-row::before{content:"";position:absolute;top:0;right:0;left:14px;height:.5px;background:var(--sep)}

/* ============ AUTH ============ */
.auth-wrap{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;gap:0}
.center-all{min-height:100vh;align-items:center;text-align:center}
.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:28px}
.logo{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,var(--cerise-500),var(--cerise-900));display:grid;place-items:center;color:#fff;font-weight:800;font-size:36px;box-shadow:0 16px 30px -12px var(--cerise-700)}
.logo.pulse{animation:pulse 1.6s ease-in-out infinite}
.auth-t{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:18px 0 0}
.lock-ic{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;margin-bottom:18px}
.lock-ic svg{width:38px;height:38px}
.timer{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin:14px 0 4px;color:var(--accent-ink)}
.auth-links{display:flex;justify-content:center;margin-top:18px}

/* ============ DETAIL ============ */
.amt-big{font-size:34px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.detail-head{text-align:center;padding:10px 0 18px}
.detail-head .sub{margin-top:6px}
.avatar{width:96px;height:96px;border-radius:50%;margin:10px auto 14px;display:grid;place-items:center;font-size:36px;font-weight:700;background:linear-gradient(135deg,var(--cerise-400),var(--cerise-800));color:#fff}

/* ============ TAB BAR (glass) ============ */
.tabbar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);width:min(398px,calc(100% - 32px));height:66px;border-radius:26px;background:var(--glass);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--glass-line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:40}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;padding:6px 0;cursor:pointer}
.tab .pill{width:58px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent-ink)}
.tab.on .pill{background:var(--accent-soft)}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 88px);right:max(20px,calc(50% - 215px + 16px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 12px 24px -10px var(--accent);z-index:41;cursor:pointer}
.fab svg{width:26px;height:26px}

/* ============ SHEETS & TOAST ============ */
#sheet-wrap{position:fixed;inset:0;z-index:60}
#sheet-wrap:empty{display:none}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:auto;max-width:430px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 22px);animation:up .32s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 14px}
.sh-t{font-size:20px;font-weight:700;margin:0 0 4px;text-align:center}
.sheet .sub{text-align:center;margin-bottom:14px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--surface-2);border:0;border-radius:18px;padding:14px;display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:500;font-size:15px;text-align:left}
.opt .ico{width:36px;height:36px}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-10px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:90;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <div id="tabbar"></div>
  <div id="fab"></div>
</div>
<div id="sheet-wrap"></div>
<div id="toast"></div>

<script>
/* ============ ICONS ============ */
const ic=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I={
  home:ic('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  wallet:ic('<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>'),
  arrows:ic('<path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/>'),
  more:ic('<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>'),
  plus:ic('<path d="M12 5v14M5 12h14"/>'),
  chev:ic('<path d="m9 6 6 6-6 6"/>'),
  back:ic('<path d="m15 6-6 6 6 6"/>'),
  bell:ic('<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>'),
  check:ic('<path d="M5 12.5 10 17 19 7"/>'),
  close:ic('<path d="M6 6l12 12M18 6 6 18"/>'),
  cart:ic('<circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/><path d="M3 4h2l2.4 11h10.2L21 7H6"/>'),
  user:ic('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'),
  gear:ic('<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>'),
  card:ic('<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6 15h4"/>'),
  down:ic('<path d="M12 4v16M6 14l6 6 6-6"/>'),
  up:ic('<path d="M12 20V4M6 10l6-6 6 6"/>'),
  bank:ic('<path d="M3 9.5 12 4l9 5.5M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/>'),
  repeat:ic('<path d="M4 11a8 8 0 0 1 14-5l2 2M20 13a8 8 0 0 1-14 5l-2-2M20 4v4h-4M4 20v-4h4"/>'),
  lock:ic('<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  logout:ic('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'),
  search:ic('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>'),
  key:ic('<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/>'),

/* ============ NAVIGATION / STATE ============ */
let cur={route:'login',params:{}};
let stack=[];
let themePref='system';

function go(route,params={},o={}){
  if(o.root) stack=[];
  else if(!o.replace) stack.push(cur);
  cur={route,params};
  render();
}
function back(){
  cur=stack.pop()||{route:'home',params:{}};
  render();
}
function tab(t){
  stack=[];
  cur={route:t,params:{}};
  render();
}
function render(){
  const r=cur.route,p=cur.params||{};
  const fn=S[r]||(()=>'<div class="screen"><p class="sub">Pantalla no encontrada</p></div>');
  document.getElementById('screen').innerHTML=`<div class="screen${AUTH.includes(r)?' auth':''}">${fn(p)}</div>`;
  const isTab=TABS.some(t=>t[0]===r);
  const tb=document.getElementById('tabbar');
  tb.className=isTab?'tabbar':'';
  tb.innerHTML=isTab?TABS.map(([k,l,i])=>`<button class="tab${r===k?' on':''}" onclick="tab('${k}')"><span class="pill">${i}</span><span>${l}</span></button>`).join(''):'';
  document.getElementById('fab').innerHTML=['home','movements'].includes(r)?`<button class="fab" aria-label="Nuevo" onclick="openSheet(newSheet())">${I.plus}</button>`:'';
  window.scrollTo(0,0);
}

function hdr(title,o={}){
  const canBack=stack.length>0&&o.back!==false;
  const left=canBack?`<button class="ib" onclick="back()" aria-label="Atrás">${I.back}</button>`:'<span></span>';
  return `<div class="bar"><div class="side">${left}</div><div class="bar-t">${title}</div><div class="side r">${o.right||''}</div></div>`;
}
function lhdr(title,o={}){
  const canBack=stack.length>0&&o.back!==false;
  return `${canBack?`<div class="topline"><button class="ib" onclick="back()" aria-label="Atrás">${I.back}</button></div>`:'<div class="topspace"></div>'}<div class="lhdr"><div>${o.kicker?`<div class="kicker">${o.kicker}</div>`:''}<h1>${title}</h1>${o.sub?`<p class="sub">${o.sub}</p>`:''}</div>${o.right?`<div class="side r">${o.right}</div>`:''}</div>`;
}

function step(btn,d,min=0){
  const v=btn.parentElement.querySelector('.v');
  v.textContent=Math.max(min,(+v.textContent)+d);
}

  const dark=themePref==='dark'||(themePref==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(themePref==='system') applyTheme(); });

/* --- Lista de compras: lógica --- */
function toggleItem(el){
  el.classList.toggle('on');
  updCount();
}
function updCount(){
  const n=document.querySelectorAll('.item.on').length;
  const t=document.querySelectorAll('.item').length;
  const c=document.getElementById('cnt');
  if(c) c.textContent=`${n} de ${t} comprados`;
}
function togglePrices(on){
  const g=document.getElementById('itemsGroup');
  const t=document.getElementById('total');
  g.classList.toggle('prices-on',on);
  t.readOnly=on;
  t.classList.toggle('locked',on);
  document.getElementById('totNote').textContent=on
    ?'El total se calcula sumando los precios de cada producto.'
    :'Escribe el total de la compra. Activa precios individuales para calcularlo.';
  if(!on) t.focus();
  recalcTotal();
}
function recalcTotal(){
  const g=document.getElementById('itemsGroup');
  if(!g||!g.classList.contains('prices-on')) return;
  let s=0;
  document.querySelectorAll('#itemsGroup .pinp').forEach(i=>s+=parseFloat(i.value)||0);
  document.getElementById('total').value=s.toFixed(2);
}
const itemRow=(n,ok)=>`<div class="row item${ok?' on':''}" onclick="toggleItem(this)">
  <div class="chk${ok?' on':''}">${I.check}</div>
  <div class="rt"><b>${n}</b></div>
  <div class="pwrap"><input class="pinp" placeholder="$0.00" inputmode="decimal" oninput="recalcTotal()" onclick="event.stopPropagation()"></div>
  <button class="ib del" aria-label="Eliminar producto" onclick="event.stopPropagation();removeItem(this)">${I.trash}</button>
</div>`;
function removeItem(btn){
  btn.closest('.item').remove();
  recalcTotal();
  updCount();
}
function addItem(){
  const i=document.getElementById('newItem');
  const v=i.value.trim();
  if(!v){ toast('Escribe el nombre del producto'); return; }
  document.getElementById('itemsList').insertAdjacentHTML('beforeend',itemRow(v,false));
  i.value='';
  recalcTotal();
  updCount();
}

  const done=l.items.filter(i=>i.ok).length;
  return hdr(l.name,{right:`<button class="tbtn" onclick="toast('Nombre editado')">Editar</button>`})+
  `<div class="lhdr" style="padding-top:8px"><div><h1>${l.name}</h1><p class="sub" id="cnt">${done} de ${l.items.length} comprados</p></div></div>
  ${grp(`<div class="row"><div class="rt"><b>Precios individuales</b><small>Suma cada precio y calcula el total</small></div>${swc(false,'onchange="togglePrices(this.checked)"')}</div>`)}
  ${sec('Productos')}
  <div class="group" id="itemsGroup">
    <div id="itemsList">${l.items.map(i=>itemRow(i.n,i.ok)).join('')}</div>
    <div class="add-row"><input id="newItem" placeholder="Agregar producto" onkeydown="if(event.key==='Enter')addItem()"><button class="tbtn" onclick="addItem()">Agregar</button></div>
  </div>
  ${sec('Total de la compra')}
  ${grp(`<div class="field"><label>Total</label><input id="total" class="tot" value="0.00" inputmode="decimal"></div>`)}
  <p class="note" id="totNote">Escribe el total de la compra. Activa precios individuales para calcularlo.</p>
  <div style="margin-top:16px"><button class="btn" onclick="openSheet(closeListSheet())">Cerrar lista</button></div>`;
};

S['shopping-form']=()=>`${hdr('Nueva lista',{right:`<button class="tbtn" onclick="toast('Lista creada');back()">Crear</button>`})}
  <div class="lhdr" style="padding-top:12px"><div><h1>Nueva lista</h1></div></div>
  ${grp(fld('Nombre',inp('Ej. Compras de la semana','')))}
  ${sec('Productos iniciales')}
  ${grp(`<textarea placeholder="Un producto por línea&#10;Leche&#10;Pan&#10;Huevos"></textarea>`)}
  <button class="btn mt" onclick="toast('Lista creada');back()">Crear lista</button>`;

/* ---- PERFIL / AJUSTES ---- */
S.profile=()=>`${hdr('Perfil')}
  <div class="detail-head"><div class="avatar">J</div><div style="font-size:22px;font-weight:700">José</div><div class="sub">jose@test.com</div></div>
  ${grp(row({t:'Nombre',r:'José'})+row({t:'Correo',r:'jose@test.com'})+row({t:'Zona horaria',r:'America/Guayaquil'})+row({t:'Moneda',r:'USD'}))}
  <div style="margin-top:16px"><button class="btn ghost" onclick="toast('Perfil guardado')">Editar perfil</button></div>`;

S.settings=()=>`${hdr('Ajustes')}
  ${sec('Apariencia')}
  ${grp(`<div style="padding:12px 14px">${seg([['system','Sistema'],['light','Claro'],['dark','Oscuro']],themePref,k=>`setTheme('${k}')`).replace('class="seg"','class="seg" style="margin:0"')}</div>`)}
  ${sec('Seguridad')}
  ${grp(row({ic:I.key,t:'Cambiar contraseña',on:"go('change-password')"})+row({ic:I.logout,t:'Cerrar sesión',on:"go('login',{},{root:true})"})+row({ic:I.device,t:'Cerrar todas las sesiones',on:"toast('Sesiones cerradas en todos los dispositivos')"}))}
  ${sec('Notificaciones')}
  ${grp(row({ic:I.bell,t:'Notificaciones push',r:swc(true)})+row({ic:I.device,t:'Dispositivos',r:'1 activo',on:"toast('1 dispositivo Android registrado')"}))}
  ${sec('Desarrollo')}
  ${grp(row({ic:I.grid,t:'Vista previa de todas las pantallas',on:"go('dev')"}))}
  <p class="hint">MONEA · prototipo v0.2</p>`;

S['change-password']=()=>`${hdr('Cambiar contraseña',{right:`<button class="tbtn" onclick="toast('Contraseña actualizada');back()">Guardar</button>`})}
  <div class="lhdr" style="padding-top:12px"><div><h1>Contraseña</h1><p class="sub">Al cambiarla se cerrarán tus sesiones activas.</p></div></div>
  ${grp(fld('Actual',inp('','','password'))+fld('Nueva',inp('','','password'))+fld('Confirmar',inp('','','password')))}
  <button class="btn mt" onclick="toast('Contraseña actualizada');back()">Actualizar contraseña</button>`;

/* ---- DEV: índice de todas las pantallas ---- */
S.dev=()=>{
  const groups=[
    ['Autenticación',[['Splash','splash','{}'],['Login','login','{}'],['Registro','register','{}'],['Bloqueo de cuenta','lock',"{kind:'account'}"],['Bloqueo por IP','lock',"{kind:'ip'}"]]],
    ['Inicio',[['Inicio','home','{}'],['Recordatorios','reminders','{}']]],
    ['Movimientos',[['Movimientos','movements','{}'],['Detalle de egreso','movement-detail',"{id:'m1'}"],['Detalle de ingreso','movement-detail',"{id:'m3'}"],['Diferido','deferred-detail',"{id:'m4'}"],['Nuevo ingreso','movement-new',"{type:'ingreso'}"],['Egreso (elegir tipo)','movement-new',"{type:'instant'}"],['Egreso diferido','movement-new',"{type:'diferido'}"],['Egreso recurrente','movement-new',"{type:'recurrente'}"],['Recurrentes','recurring-list','{}'],['Detalle recurrente','recurring-detail',"{id:'r1'}"],['Definir monto','define-amount','{}']]],
    ['Gestión',[['Gestión','manage','{}'],['Cobros','obligations',"{tab:'cobros'}"],['Préstamos','obligations',"{tab:'prestamos'}"],['Deudas','obligations',"{tab:'deudas'}"],['Detalle de cobro','obligation-detail',"{type:'cobros',id:'co1'}"],['Nuevo registro','obligation-form',"{type:'prestamos'}"],['Listas abiertas','shopping',"{tab:'open'}"],['Listas cerradas','shopping',"{tab:'closed'}"],['Detalle de lista','shopping-detail',"{id:'s1'}"],['Nueva lista','shopping-form','{}']]],
    ['Más y cuentas',[['Más','more','{}'],['Cuentas','accounts',"{tab:'accounts'}"],['Tarjetas','accounts',"{tab:'cards'}"],['Detalle de cuenta','account-detail',"{id:'a1'}"],['Nueva cuenta','account-form','{}'],['Detalle de tarjeta','card-detail',"{id:'c1',period:'2026-10'}"],['Nueva tarjeta','card-form','{}'],['Perfil','profile','{}'],['Ajustes','settings','{}'],['Cambiar contraseña','change-password','{}']]]
  ];
  return `${hdr('Vista previa',{})}
  <div class="lhdr" style="padding-top:8px"><div><h1>Pantallas</h1><p class="sub">Índice del prototipo. Navega a cualquier pantalla.</p></div></div>
  ${groups.map(([t,items])=>`${sec(t)}${grp(items.map(([l,r,p])=>row({t:l,on:`go('${r}',${p})`})).join(''))}`).join('')}
  ${sec('Hojas (sheets)')}
  ${grp(
    row({t:'Acciones rápidas (+)',on:"openSheet(newSheet())"})+
    row({t:'Pagar tarjeta',on:"openSheet(cardPaySheet('c1'))"})+
    row({t:'Cerrar lista de compras',on:"openSheet(closeListSheet())"})+
    row({t:'Marcar cuota pagada',on:"openSheet(paySheet('demo',33.33,'Ana Torres'))"})
  )}`;
};

/* ============ INIT ============ */
applyTheme();
cur={route:'login',params:{}};
render();
